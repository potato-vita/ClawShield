risk_graph_rules:
  sensitive_source_to_external_sink:
    enabled: true
    source_actions_ref: sensitive_read_actions
    sink_actions_ref: external_sink_actions
    violation_type: chain_semantic_drift
    mapped_standards:
      - owasp_llm_top10_2025: LLM02 Sensitive Information Disclosure
      - owasp_llm_top10_2025: LLM06 Excessive Agency
      - owasp_agentic_top10: Tool Misuse and Exploitation
  injection_source_to_dangerous_sink:
    enabled: true
    sink_actions:
      - network_post
      - external_send
      - send_email
      - shell_exec
      - delete_file
      - web_submit
      - create_calendar_event
      - modify_calendar_event
      - modify_financial_transaction
      - write_user_data
      - modify_credentials
    violation_type: prompt_injection_induced_drift
    mapped_standards:
      - owasp_llm_top10_2025: LLM01 Prompt Injection
      - owasp_agentic_top10: Agent Behavior Hijacking
      - owasp_agentic_top10: Tool Misuse and Exploitation
  forbidden_resource_to_external_sink:
    enabled: true
    source_actions_ref: sensitive_read_actions
    sink_actions_ref: external_sink_actions
    violation_type: chain_semantic_drift
    mapped_standards:
      - owasp_llm_top10_2025: LLM02 Sensitive Information Disclosure
  destructive_after_sensitive_read:
    enabled: true
    source_actions_ref: sensitive_read_actions
    sink_actions_ref: destructive_actions
    violation_type: chain_semantic_drift
    mapped_standards:
      - owasp_llm_top10_2025: LLM06 Excessive Agency
      - owasp_agentic_top10: Tool Misuse and Exploitation
