sources:
  - id: owasp_llm_top10_2025
    name: OWASP Top 10 for LLM Applications 2025
    url: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    mapped_risks:
      - LLM01 Prompt Injection
      - LLM02 Sensitive Information Disclosure
      - LLM06 Excessive Agency
      - LLM07 System Prompt Leakage
      - LLM08 Vector and Embedding Weakness
  - id: owasp_agentic_top10
    name: OWASP Top 10 for Agentic Applications
    url: https://genai.owasp.org/
    mapped_risks:
      - Agent Behavior Hijacking
      - Tool Misuse and Exploitation
      - Identity and Privilege Abuse
      - Memory and Context Poisoning
  - id: nvidia_nemo_guardrails
    name: NVIDIA NeMo Guardrails rail types
    url: https://docs.nvidia.com/nemo/guardrails/latest/about/rail-types.html
    mapped_risks:
      - Input rails
      - Retrieval rails
      - Dialog rails
      - Execution rails
      - Output rails

action_groups:
  sensitive_read_actions:
    - read_file
    - read_database_field
    - sql_query
    - read_calendar
    - read_email
    - read_contacts
    - read_financial_data
    - read_user_data
  external_sink_actions:
    - network_post
    - external_send
    - send_email
    - web_submit
  destructive_actions:
    - delete_file
    - delete_email
    - modify_credentials
    - modify_financial_transaction
  state_changing_actions:
    - write_file
    - create_file
    - append_to_file
    - create_calendar_event
    - modify_calendar_event
    - write_user_data
    - modify_credentials
    - modify_financial_transaction
  write_actions:
    - write_file
    - create_file
    - append_to_file
  semantic_transform_actions:
    - summarize_text
    - calculate
    - filter_database
    - aggregate
    - final_answer

