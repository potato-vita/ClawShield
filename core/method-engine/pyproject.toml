[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceshield-method-engine"
version = "0.1.0"
description = "Isolated TraceShield runtime method core"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"traceshield_method.method" = ["configs/*.yaml", "configs/nemo_guardrails/*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "python/tests"]
pythonpath = ["python"]
